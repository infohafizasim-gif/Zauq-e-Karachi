<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Zauq-e-Karachi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
.contact-hero {
    padding: 140px 0 60px;
    text-align: center;
}
.contact-hero h1 {
    font-size: 4rem;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
}
.contact-hero span {
    color: var(--gold);
}
.contact-box {
    background: #111;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 0 20px rgba(0,0,0,.4);
}
.contact-box input,
.contact-box textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    background: #0d0d0d;
    border: 1px solid rgba(255,255,255,.1);
    color: white;
    border-radius: 12px;
    outline: none;
}
.contact-box input:focus,
.contact-box textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(212,167,98,.15);
}
.contact-box button {
    background: linear-gradient(135deg, var(--gold), #f8cc84);
    color: black;
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-weight: 700;
    transition: .3s;
}
.contact-box button:hover {
    transform: translateY(-4px);
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container-fluid px-lg-5">
        <a class="navbar-brand" href="index.html">ZAUQ<span>-E-KARACHI</span></a>
        <button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="restaurants.html">Restaurants</a></li>
                <li class="nav-item"><a class="nav-link" href="hidden-gems.html">Hidden Gems</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
            </ul>
            <ul class="navbar-nav" id="authArea"></ul>
        </div>
    </div>
</nav>
<section class="contact-hero">
    <div class="container">
        <h1>Contact <span>Us</span></h1>
        <p class="text-muted">We’d love to hear your food suggestions.</p>
    </div>
</section>
<section class="pb-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="contact-box">
                    <form id="contactForm">
                        <input type="text" placeholder="Your Name" required>
                        <input type="email" placeholder="Your Email" required>
                        <textarea rows="5" placeholder="Your Message"></textarea>
                        <button type="submit">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<script>
document.getElementById("contactForm").addEventListener("submit", function (e) {
    e.preventDefault();
    alert("Message sent successfully!");
    this.reset();
});
</script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="base.js"></script>
<script src="navbar-auth.js"></script>
</body>
</html>
